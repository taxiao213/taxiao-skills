<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - 他晓</title>
</head>
<body>

<!-- 注意：本模板为全内联样式版本。禁止：样式表标签、CSS 类名、CSS 变量、flex/grid 布局 -->
<!-- 图片路径使用相对路径：{文章主题}_公众号推文_assets/xxx.png -->

<div style="max-width:680px; margin:0 auto; padding:0 16px;">

  <!-- ===== ARTICLE HEADER ===== -->
  <div style="text-align:center; padding:0 0 28px; background:#FFFFFF; border-radius:0 0 16px 16px; box-shadow:0 1px 3px rgba(25,118,210,0.06); margin-bottom:4px; overflow:hidden;">
    <img src="assets/header_deco.png" alt="header decoration" style="width:100%; max-width:100%; margin-left:0; margin-right:0; border-radius:0; margin-bottom:22px; display:block;" />
    <div style="text-align:center; margin-bottom:18px;">
      <img src="assets/avatar.png" alt="他晓" style="width:40px; height:40px; border-radius:10px; box-shadow:0 2px 8px rgba(25,118,210,0.15); vertical-align:middle; margin-right:10px;" />
      <span style="font-family:Georgia,'Noto Serif SC',serif; font-size:17px; font-weight:700; color:#1976D2; letter-spacing:2px; vertical-align:middle;">他晓</span>
    </div>
    <h1 style="font-family:Georgia,'Noto Serif SC',serif; font-size:26px; font-weight:900; color:#1A2332; line-height:1.4; margin:0 0 10px; padding:0 8px;">{{TITLE}}</h1>
    <p style="font-size:14px; color:#718096; font-weight:400; letter-spacing:0.5px; padding:0 16px; margin:0;" align="center">{{SUBTITLE}}</p>
  </div>

  <!-- ===== ARTICLE CONTENT START ===== -->
  <div style="padding:0;" align="left">

    <!-- 在此下方放置文章正文内容 -->
    <!-- 所有正文 <p> 必须加 align="left" -->
    <!-- 所有内容 <div> 必须加 align="left" -->
    <!-- 标题只用 <h2>，通过 font-size 区分层级 -->

  <!-- ===== ARTICLE CONTENT END ===== -->
  </div>

  <!-- ===== ARTICLE FOOTER ===== -->
  <div style="text-align:center; padding:20px 0 44px; background:#FFFFFF; border-radius:16px 16px 0 0; box-shadow:0 -2px 12px rgba(0,0,0,0.04); margin-top:4px; overflow:hidden;">
    <img src="assets/footer_deco.png" alt="footer decoration" style="width:100%; max-width:100%; margin-left:0; margin-right:0; border-radius:0; margin-bottom:24px; opacity:0.5; display:block;" />

    <!-- 社群邀请 -->
    <div style="margin:0 auto 24px; max-width:480px; background:linear-gradient(135deg,#E3F2FD 0%,#F3E5F5 100%); border-radius:16px; padding:24px 20px; border:1px solid rgba(25,118,210,0.1); box-shadow:0 2px 12px rgba(25,118,210,0.06);">
      <div style="font-family:Georgia,'Noto Serif SC',serif; font-size:16px; font-weight:700; color:#1976D2; margin-bottom:8px; text-align:center;">💬 加入「他晓」交流社群</div>
      <div style="font-size:13px; color:#4A5568; line-height:1.9; text-align:center; margin-bottom:16px;">
        和志同道合的朋友一起<br/>探讨 AI、技术与成长的无限可能 ✨
      </div>
      <div style="background:#FFFFFF; border-radius:12px; padding:14px 16px; border:1px solid #E2E8F0; box-shadow:0 1px 4px rgba(0,0,0,0.04);">
        <div style="font-size:13px; color:#4A5568; line-height:1.8; text-align:center;">
          <div style="font-weight:600; color:#1976D2; margin-bottom:12px;">添加微信：扫描下方二维码</div>
          <img src="assets/qrcode_wechat.png" alt="微信二维码" style="display:block; width:100px; height:100px; border-radius:10px; margin:0 auto 12px;" />
          <span style="display:inline-block; background:#E3F2FD; color:#1565C0; font-size:12px; font-weight:600; padding:2px 12px; border-radius:8px; letter-spacing:0.5px;">备注「他晓」邀请进群</span>
        </div>
      </div>
    </div>

    <!-- 双二维码并排（table 布局，禁止 flex） -->
    <table style="margin:0 auto 20px; border-collapse:collapse;" align="center">
      <tr>
        <td style="width:50%; text-align:center; padding:0 8px; vertical-align:top;">
          <div style="background:#FFFFFF; border:1px solid #E2E8F0; border-radius:14px; padding:16px 12px; box-shadow:0 1px 3px rgba(25,118,210,0.06);">
            <img src="assets/qrcode_gzh.jpg" alt="公众号二维码" style="width:120px; height:120px; border-radius:10px; margin-bottom:10px;" />
            <div style="font-family:Georgia,'Noto Serif SC',serif; font-size:14px; font-weight:600; color:#1976D2; margin-bottom:4px;">公众号 · 他晓</div>
            <div style="font-size:11px; color:#718096;">关注获取更多内容</div>
          </div>
        </td>
        <td style="width:50%; text-align:center; padding:0 8px; vertical-align:top;">
          <div style="background:#FFFFFF; border:1px solid #E2E8F0; border-radius:14px; padding:16px 12px; box-shadow:0 1px 3px rgba(25,118,210,0.06);">
            <img src="assets/qrcode_xcx.jpg" alt="小程序二维码" style="width:120px; height:120px; border-radius:10px; margin-bottom:10px;" />
            <div style="font-family:Georgia,'Noto Serif SC',serif; font-size:14px; font-weight:600; color:#1976D2; margin-bottom:4px;">小程序 · 人格派对</div>
            <div style="font-size:11px; color:#718096;">开启你的探索之旅</div>
          </div>
        </td>
      </tr>
    </table>

    <p style="font-size:12px; color:#718096; letter-spacing:0.5px; margin:0;" align="center">长按识别二维码关注</p>
    <p style="font-size:11px; color:#9CA3AF; margin-top:14px; margin-bottom:0;" align="center">© 2026 他晓 · All Rights Reserved</p>
  </div>

</div>

</body>
</html>
