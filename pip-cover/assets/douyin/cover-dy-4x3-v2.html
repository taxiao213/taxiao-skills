<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  抖音横版封面 V2（1440×1080）· 实拍照片全幅打底 + 大字压字 + 白底胶囊（0930 版式，防「截屏当封面」flag）
  版式原理：实拍照片放大右移（width 120%），左侧柔光渐变保证文字可读；
    文字一律带白底胶囊/投影，无任何终端元素（网格、窗口栏、圆点、等宽代码感）。
  用法：复制到产出目录，替换 {{TOKEN}}；{{AVATAR_PATH}} 为实拍照片相对路径；
        照片取景调 .photo img 的 object-position（人物在照片右侧时填 60%~70% 40%）。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1440px; height: 1080px; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    position: relative;
    overflow: hidden;
    background: #101410;
    color: #FFFFFF;
  }
  .mono { font-family: "SF Mono", Menlo, monospace; }

  /* 实拍照片全幅打底：width 120% 右移，人物让出左侧文字区 */
  .photo { position: absolute; inset: 0; z-index: 1; }
  .photo img {
    width: 120%; height: 100%; display: block;
    margin-left: -3%;
    object-fit: cover; object-position: {{PHOTO_POSITION}};
  }
  /* 左侧柔光渐变 + 底部渐变，保证文字可读 */
  .scrim { position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(90deg, rgba(10,14,11,.74) 0%, rgba(10,14,11,.40) 42%, rgba(10,14,11,0) 72%),
      linear-gradient(0deg, rgba(10,14,11,.60) 0%, rgba(10,14,11,0) 30%);
  }

  .content { position: relative; z-index: 2; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; }
  .kicker {
    align-self: flex-start;
    background: rgba(255,255,255,.94); color: #131A15;
    padding: 10px 26px; border-radius: 999px;
    font-size: 26px; font-weight: 700; letter-spacing: 3px;
    margin-bottom: 36px;
  }
  h1 { font-size: {{TITLE_SIZE}}px; line-height: 1.22; font-weight: 800; letter-spacing: 2px;
       text-shadow: 0 4px 30px rgba(0,0,0,.6); }
  h1 .accent { color: {{ACCENT}}; }
  .hook {
    margin-top: 40px; align-self: flex-start;
    background: rgba(255,255,255,.94); color: #131A15;
    padding: 14px 28px; border-radius: 999px;
    font-size: 28px; font-weight: 600;
  }

  .footer { position: absolute; z-index: 2; left: 72px; bottom: 48px; }
  .footer .big { font-size: 42px; font-weight: 800; letter-spacing: 2px;
                 text-shadow: 0 3px 18px rgba(0,0,0,.7); }
  .footer .sub { margin-top: 8px; font-size: 24px; color: rgba(255,255,255,.88);
                 text-shadow: 0 3px 14px rgba(0,0,0,.7); }
</style>
</head>
<body>
  <div class="photo"><img src="{{AVATAR_PATH}}" alt=""></div>
  <div class="scrim"></div>

  <div class="content">
    <div class="kicker">{{KICKER}}</div>
    <h1>{{TITLE_HTML}}</h1>
    <div class="hook">{{HOOK}}</div>
  </div>

  <div class="footer">
    <div class="big">{{FOOTER_BIG}}</div>
    <div class="sub">{{FOOTER_SUB}}</div>
  </div>
</body>
</html>
