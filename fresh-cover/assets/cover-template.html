<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  清新极简封面模板（奶白底 + 嫩绿 + 赤陶，默认横屏 1920×1080）
  用法：复制本文件到产出目录，替换下方 {{TOKEN}} 占位内容，再用 scripts/render.sh 出图（绝对路径！）。
  可调整：
  - :root 里的配色变量（换主题色只改这里）
  - 关键词胶囊（.chip）数量：复制/删除即可，建议 2-4 个
  - 删除线：不需要时删除 h1 里的 .strike 结构，标题整体用主文字色
  - 头像：不需要时整段删除 .avatar-ring 和 .avatar
  - 画布尺寸：html,body 的 width/height 必须与 render.sh 的宽高参数一致
-->
<style>
  :root {
    --bg: #F6F4EC;            /* 奶白纸感底 */
    --surface: #FFFFFF;
    --text: #25372B;          /* 深绿灰 */
    --muted: #7A8B7D;
    --accent: #3E9E5F;        /* 嫩绿 */
    --accent-soft: #E4F2E4;
    --danger: #DF6B4F;        /* 赤陶 */
    --line: rgba(37,55,43,.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{WIDTH}}px; height: {{HEIGHT}}px; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    position: relative;
    overflow-x: clip;   /* 注意：不要用 overflow:hidden，否则浏览器预览时无法滚动 */
  }
  .mono { font-family: "SF Mono", Menlo, monospace; }

  /* 氛围：柔光团 + 圆点纸纹 */
  .blob-a {
    position: absolute; top: -280px; left: -200px;
    width: 920px; height: 920px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(62,158,95,.20), transparent);
  }
  .blob-b {
    position: absolute; bottom: -340px; right: -160px;
    width: 1020px; height: 1020px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(223,107,79,.13), transparent);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(62,158,95,.12) 2.2px, transparent 2.2px);
    background-size: 46px 46px;
  }

  .wrap { position: relative; padding: 108px 100px; height: 100%; display: flex; flex-direction: column; }

  .kicker {
    display: inline-flex; align-items: center;
    align-self: flex-start;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 12px 28px; border-radius: 999px;
    font-size: 30px; letter-spacing: 4px; font-weight: 700;
  }

  h1 { margin-top: 52px; font-size: 150px; line-height: 1.14; font-weight: 800; letter-spacing: 2px; }
  h1 .accent { color: var(--accent); }
  h1 .neg { color: var(--danger); }
  /* 手绘删除线：绝对定位横条，不要用 text-decoration */
  .strike { position: relative; white-space: nowrap; }
  .strike::after {
    content: "";
    position: absolute; left: -12px; right: -12px; top: 52%;
    height: 16px; border-radius: 999px;
    background: var(--danger);
    transform: rotate(-2.5deg);
    opacity: .9;
  }

  .lead { margin-top: 56px; font-size: 48px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }

  .chips { margin-top: 40px; display: flex; gap: 26px; }
  .chip {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 22px 38px;
    font-size: 36px; font-weight: 700;
    box-shadow: 0 12px 28px rgba(37,55,43,.07);
  }
  .chip b { color: var(--accent); }
  .chip em { color: var(--danger); font-style: normal; }

  .teaser {
    margin-top: auto;
    font-size: 28px; color: var(--muted); letter-spacing: 3px;
  }
  .teaser b { color: var(--text); font-weight: 700; }

  /* 圆形头像 + 虚线圆环，默认不带身份文字 */
  .avatar {
    position: absolute; right: 130px; top: 50%;
    transform: translateY(-50%);
    width: 430px; height: 430px;
    border-radius: 50%;
    border: 14px solid #FFFFFF;
    box-shadow: 0 34px 80px rgba(37,55,43,.18);
    overflow: hidden;
    background: var(--surface);
  }
  .avatar img {
    width: 100%; height: 100%; display: block;
    object-fit: cover; object-position: center 12%;   /* N 越小越靠上，头肩特写一般 12-22% */
  }
  .avatar-ring {
    position: absolute; right: 96px; top: 50%;
    transform: translateY(-50%);
    width: 500px; height: 500px;
    border-radius: 50%;
    border: 3px dashed rgba(62,158,95,.5);
  }
</style>
</head>
<body>
  <div class="blob-a"></div>
  <div class="blob-b"></div>
  <div class="dots"></div>
  <div class="wrap">
    <div class="kicker">{{KICKER}}</div>

    <!-- 删除线变体：不是<span class="strike">换提示词</span>；无删除线时直接写标题文字 -->
    <h1>{{TITLE_HTML}}</h1>

    <div class="lead">{{LEAD}}</div>

    <div class="chips">
      <div class="chip"><b>{{CHIP1_KEY}}</b> · <em>{{CHIP1_ACT}}</em></div>
      <div class="chip"><b>{{CHIP2_KEY}}</b> · <em>{{CHIP2_ACT}}</em></div>
      <div class="chip"><b>{{CHIP3_KEY}}</b> · <em>{{CHIP3_ACT}}</em></div>
    </div>

    <div class="teaser mono">{{TEASER}}</div>
  </div>

  <div class="avatar-ring"></div>
  <div class="avatar">
    <img src="{{AVATAR_PATH}}" alt="avatar">
  </div>
</body>
</html>
