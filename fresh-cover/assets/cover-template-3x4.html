<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  清新极简封面模板 · 竖版 3:4（1080×1440，抖音竖封面/小红书竖版）
  布局：上下结构——头像缩小放右上，标题两行，chips 全宽横条。
  用法：复制本文件到产出目录，替换 {{TOKEN}}，render.sh 出图（绝对路径！）。
  注意：标题第一行别超过 ~8 个全角字符等宽（104px 下内宽 928px），
       长了会换行变三行并把底部 teaser 挤出画布（踩过的坑）。
-->
<style>
  :root {
    --bg: #F6F4EC;
    --surface: #FFFFFF;
    --text: #25372B;
    --muted: #7A8B7D;
    --accent: #3E9E5F;
    --accent-soft: #E4F2E4;
    --danger: #DF6B4F;
    --line: rgba(37,55,43,.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1440px; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    position: relative;
    overflow-x: clip;
  }
  .mono { font-family: "SF Mono", Menlo, monospace; }

  .blob-a {
    position: absolute; top: -240px; left: -180px;
    width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(62,158,95,.20), transparent);
  }
  .blob-b {
    position: absolute; bottom: -300px; right: -140px;
    width: 840px; height: 840px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(223,107,79,.13), transparent);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(62,158,95,.12) 2px, transparent 2px);
    background-size: 42px 42px;
  }

  .wrap { position: relative; padding: 96px 76px 80px; height: 100%; display: flex; flex-direction: column; }

  .kicker {
    display: inline-flex; align-items: center;
    align-self: flex-start;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 12px 26px; border-radius: 999px;
    font-size: 30px; letter-spacing: 3px; font-weight: 700;
  }

  h1 { margin-top: 230px; font-size: 104px; line-height: 1.14; font-weight: 800; letter-spacing: 2px; }
  h1 .neg { color: var(--danger); }
  /* 手绘删除线：绝对定位横条，不要用 text-decoration */
  .strike { position: relative; white-space: nowrap; }
  .strike::after {
    content: "";
    position: absolute; left: -10px; right: -10px; top: 52%;
    height: 14px; border-radius: 999px;
    background: var(--danger);
    transform: rotate(-2.5deg);
    opacity: .9;
  }

  .lead { margin-top: 56px; font-size: 46px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }

  .chips { margin-top: 56px; display: flex; flex-direction: column; gap: 22px; }
  .chip {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 24px;
    padding: 24px 34px;
    font-size: 34px; font-weight: 700;
    text-align: center;
    box-shadow: 0 10px 24px rgba(37,55,43,.07);
  }
  .chip b { color: var(--accent); }
  .chip em { color: var(--danger); font-style: normal; }

  .teaser {
    margin-top: auto;
    font-size: 27px; color: var(--muted); letter-spacing: 2px;
  }
  .teaser b { color: var(--text); font-weight: 700; }

  /* 竖屏：头像缩小放右上（margin-top: 230px 的标题区已为它留白，改动头像尺寸需同步调标题 margin） */
  .avatar {
    position: absolute; right: 76px; top: 84px;
    width: 300px; height: 300px;
    border-radius: 50%;
    border: 11px solid #FFFFFF;
    box-shadow: 0 26px 60px rgba(37,55,43,.18);
    overflow: hidden;
    background: var(--surface);
  }
  .avatar img {
    width: 100%; height: 100%; display: block;
    object-fit: cover; object-position: center 12%;
  }
  .avatar-ring {
    position: absolute; right: 51px; top: 59px;
    width: 350px; height: 350px;
    border-radius: 50%;
    border: 3px dashed rgba(62,158,95,.5);
  }
</style>
</head>
<body>
  <div class="blob-a"></div>
  <div class="blob-b"></div>
  <div class="dots"></div>
  <div class="wrap">
    <div class="kicker">{{KICKER}}</div>

    <!-- 两行标题；删除线变体：<span class="neg">8 个</span>是<span class="strike">换提示词</span> -->
    <h1>{{TITLE_HTML}}</h1>

    <div class="lead">{{LEAD}}</div>

    <div class="chips">
      <div class="chip"><b>① {{CHIP1_KEY}}</b> · <em>{{CHIP1_ACT}}</em></div>
      <div class="chip"><b>② {{CHIP2_KEY}}</b> · <em>{{CHIP2_ACT}}</em></div>
      <div class="chip"><b>③ {{CHIP3_KEY}}</b> · <em>{{CHIP3_ACT}}</em></div>
    </div>

    <div class="teaser mono">{{TEASER}}</div>
  </div>

  <div class="avatar-ring"></div>
  <div class="avatar">
    <img src="{{AVATAR_PATH}}" alt="avatar">
  </div>
</body>
</html>
